<!DOCTYPE html>
<html lang="en">


<head>


<meta charset="UTF-8">


<meta name="viewport" content="width=device-width, initial-scale=1.0">



<title>
My Bookings | Servora
</title>





<link rel="stylesheet"
href="css/style.css">



</head>



<body>





<header class="navbar">



<div class="logo">

<h2>
Servora
</h2>

</div>





<nav>



<a href="customer/dashboard.html">

Dashboard

</a>




<a href="book-service.html">

Book Service

</a>




<a href="service-status.html">

Status

</a>




<a href="profile.html">

Profile

</a>



</nav>



</header>









<section class="bookings-section">



<div class="bookings-container">



<h1>

My Service Bookings

</h1>




<p>

View all your vehicle service requests.

</p>






<div id="bookingList">


<p>

Loading bookings...

</p>



</div>





</div>


</section>









<footer class="footer">



<div class="footer-bottom">



<p>

© 2026 Servora. All Rights Reserved.

</p>



</div>



</footer>

<script type="module">


import {

    auth,

    db

}

from "./js/firebase-config.js";






import {

    onAuthStateChanged

}

from

"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";






import {

    ref,

    get

}

from

"https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";








const bookingList =

document.getElementById("bookingList");









// ================================
// CHECK LOGIN
// ================================



onAuthStateChanged(auth,(user)=>{



if(user){



loadBookings(user.uid);



}



else{


window.location.href="login.html";


}



});











// ================================
// LOAD USER BOOKINGS
// ================================



async function loadBookings(uid){



try{



const bookingRef =

ref(

db,

"bookings"

);






const snapshot =

await get(bookingRef);







bookingList.innerHTML="";






if(!snapshot.exists()){



showNoBookings();


return;


}







const bookings =

snapshot.val();






let userBookings = [];








Object.keys(bookings).forEach((id)=>{



const booking =

bookings[id];






if(booking.customerId === uid){



userBookings.push(booking);



}



});







// Sort latest booking first


userBookings.sort(

(a,b)=>

(b.createdAt || 0)

-

(a.createdAt || 0)

);









if(userBookings.length === 0){



showNoBookings();


return;


}








userBookings.forEach((booking)=>{



bookingList.innerHTML +=



`

<div class="booking-card">






<h2>

${booking.serviceType || "Service"}

</h2>






<hr>







<p>

🚗 Vehicle:

${booking.vehicleName || "Not Available"}

</p>







<p>

🔢 Number:

${booking.vehicleNumber || "Not Available"}

</p>








<p>

📅 Booking Date:

${booking.bookingDate || "Not Available"}

</p>








<p>

👨‍🔧 Mechanic:

${booking.mechanicName || "Not Assigned"}

</p>








<p>

💰 Estimated Cost:

₹${booking.estimatedCost || 0}

</p>









<p>

Status:

<span class="status">

${booking.status || "Pending"}

</span>

</p>









<p>

${booking.mechanicNote || "No updates yet"}

</p>







</div>



`;



});






}



catch(error){



console.error(

"Booking Loading Error:",

error

);



bookingList.innerHTML =



`

<div class="no-booking">


<h3>

Unable to load bookings

</h3>


<p>

Please try again later.

</p>


</div>


`;



}



}











// ================================
// NO BOOKINGS MESSAGE
// ================================



function showNoBookings(){



bookingList.innerHTML =



`

<div class="no-booking">



<h3>

No Bookings Found

</h3>




<p>

Book your first vehicle service.

</p>




<a href="book-service.html">

Book Service

</a>




</div>



`;



}



</script>
</body>
</html>
