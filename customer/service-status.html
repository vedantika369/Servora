</p>

<script type="module">
/* ==========================================
   SERVORA SERVICE STATUS
   REALTIME DATABASE
========================================== */

import {
    auth,
    db
}
from "/static/js/firebase-config.js";

import {
    onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
    ref,
    get
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


/* ==========================================
   ELEMENTS
========================================== */

const statusList =
    document.getElementById("statusList");


/* ==========================================
   AUTHENTICATION
========================================== */

onAuthStateChanged(auth, (user) => {

    if (!user) {

        window.location.href = "login.html";
        return;

    }

    loadServiceStatus(user.uid);

});


/* ==========================================
   LOAD SERVICE STATUS
========================================== */

async function loadServiceStatus(uid) {

    try {

        const snapshot =
            await get(ref(db, "bookings"));

        statusList.innerHTML = "";

        if (!snapshot.exists()) {

            statusList.innerHTML = `

                <div class="no-booking">

                    <h3>No Active Services</h3>

                    <p>
                        You currently have no service requests.
                    </p>

                </div>

            `;

            return;

        }

        const bookings = snapshot.val();

        let found = false;

        /* -------------------------
           FILTER USER BOOKINGS
        ------------------------- */

        const bookingArray = Object.entries(bookings)
            .map(([id, booking]) => ({
                id,
                ...booking
            }))
            .filter(booking => booking.customerId === uid)
            .sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));

        if (bookingArray.length === 0) {

            statusList.innerHTML = `

                <div class="no-booking">

                    <h3>No Active Services</h3>

                    <p>
                        You currently have no service requests.
                    </p>

                </div>

            `;

            return;

        }

        /* -------------------------
           DISPLAY BOOKINGS
        ------------------------- */

        bookingArray.forEach((booking) => {

            found = true;

            statusList.innerHTML += `

            <div class="status-card">

                <h2>${booking.serviceType}</h2>

                <hr>

                <p>
                    <strong>Vehicle:</strong>
                    ${booking.vehicleName}
                </p>

                <p>
                    <strong>Vehicle Number:</strong>
                    ${booking.vehicleNumber}
                </p>

                <p>
                    <strong>Booking Date:</strong>
                    ${booking.bookingDate}
                </p>

                <p>
                    <strong>Mechanic:</strong>
                    ${booking.mechanicName || "Not Assigned"}
                </p>

                <p>
                    <strong>Current Status:</strong>

                    <span class="status">

                        ${booking.status}

                    </span>

                </p>

                <div class="progress">

                    <div class="step ${booking.status.replace(/\s/g,'')}">
                    </div>

                </div>

                <p>

                    <strong>Estimated Cost:</strong>

                    ₹${booking.estimatedCost || 0}

                </p>

                <p>

                    <strong>Repair Notes:</strong>

                    ${booking.mechanicNote || "No updates yet"}

                </p>

            </div>

            `;

        });

    }

    catch (error) {

        console.error(error);

        statusList.innerHTML = `

            <div class="no-booking">

                <h3>Error</h3>

                <p>${error.message}</p>

            </div>

        `;

    }

}

/* ==========================================
   INITIALIZE PAGE
========================================== */

document.addEventListener("DOMContentLoaded", () => {

    statusList.innerHTML = `
        <p>Loading service status...</p>
    `;

});


/* ==========================================
   END OF SERVICE STATUS
========================================== */

</script>
