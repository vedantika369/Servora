<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
Profile | Servora
</title>

<link rel="stylesheet"
href="../css/style.css">

</head>

<body>

<header class="navbar">

<div class="logo">

<h2>
Servora
</h2>

</div>

<nav>

<a href="dashboard.html">
Dashboard
</a>

<a href="my-vehicles.html">
My Vehicles
</a>

<a href="bookings.html">
Bookings
</a>

<button id="logoutBtn">

Logout

</button>

</nav>

</header>





<section class="profile-section">

<div class="profile-container">

<h1>

My Profile

</h1>

<div class="profile-card">

<form id="profileForm">

<label>

Name

</label>

<input
type="text"
id="name"
required>

<label>

Email

</label>

<input
type="email"
id="email"
readonly>

<label>

Phone Number

</label>

<input
type="text"
id="phone"
placeholder="Enter phone number">

<button type="submit">

Update Profile

</button>

<p id="message"></p>

</form>

</div>

</div>

</section>





<footer class="footer">

<div class="footer-bottom">

<p>

© 2026 Servora.Developed by Vedantika Deshmukh from Arvind Gavali College of Engineerin,Satara in Inplant Training 2026. All Rights Reserved.

</p>

</div>

</footer>

<script type="module">

import {
    auth,
    db
}
from "/static/js/firebase-config.js";

import {
    onAuthStateChanged,
    signOut
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
    ref,
    get,
    update
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";



const profileForm = document.getElementById("profileForm");

const nameInput = document.getElementById("name");
const emailInput = document.getElementById("email");
const phoneInput = document.getElementById("phone");

const logoutBtn = document.getElementById("logoutBtn");
const message = document.getElementById("message");

let currentUser = null;



// ======================================
// CHECK LOGIN
// ======================================

onAuthStateChanged(auth, async (user) => {

    if (!user) {

        window.location.href = "login.html";
        return;

    }

    currentUser = user;

    loadProfile(user.uid);

});



// ======================================
// LOAD PROFILE
// ======================================

async function loadProfile(uid) {

    try {

        const snapshot = await get(ref(db, "users/" + uid));

        if (!snapshot.exists()) {

            message.style.color = "red";
            message.innerHTML = "Profile not found.";

            return;

        }

        const data = snapshot.val();

        nameInput.value = data.name || "";
        emailInput.value = data.email || "";
        phoneInput.value = data.phone || "";

    }

    catch (error) {

        console.error(error);

        message.style.color = "red";
        message.innerHTML = "Unable to load profile.";

    }

}



// ======================================
// UPDATE PROFILE
// ======================================

profileForm.addEventListener("submit", async (e) => {

    e.preventDefault();

    if (!currentUser) return;

    try {

        await update(ref(db, "users/" + currentUser.uid), {

            name: nameInput.value.trim(),

            email: emailInput.value,

            phone: phoneInput.value.trim()

        });

        message.style.color = "green";
        message.innerHTML = "Profile updated successfully.";

    }

    catch (error) {

        console.error(error);

        message.style.color = "red";
        message.innerHTML = "Unable to update profile.";

    }

});



// ======================================
// LOGOUT
// ======================================

logoutBtn.addEventListener("click", async () => {

    try {

        await signOut(auth);

        window.location.href = "login.html";

    }

    catch (error) {

        console.error(error);

        alert("Logout failed.");

    }

});

</script>
