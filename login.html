<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Servora</title>

    <link rel="icon" href="images/logo.png">

    <link rel="stylesheet" href="css/style.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

    <!-- HEADER -->
    <header class="navbar">

        <div class="container">

            <a href="index.html" class="logo">

                <img src="images/logo.png" alt="Servora Logo">

                <div class="logo-text">
                    <h2>Servora</h2>
                    <span>Drive Smart. Service Smarter.</span>
                </div>

            </a>

            <div class="nav-buttons">

                <a href="index.html" class="btn-login">
                    Home
                </a>

                <a href="register.html" class="btn-register">
                    Register
                </a>

            </div>

        </div>

    </header>

    <!-- LOGIN -->
    <section class="auth-section">

        <div class="auth-container">

            <div class="auth-box">

                <div class="auth-header">

                    <h2>Welcome Back</h2>

                    <p>Login to manage your vehicles and bookings.</p>

                </div>

                <form id="loginForm">

                    <div class="form-group">

                        <label>
                            <i class="fa-solid fa-envelope"></i>
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="email"
                            placeholder="Enter your email"
                            required>

                    </div>

                    <div class="form-group">

                        <label>
                            <i class="fa-solid fa-lock"></i>
                            Password
                        </label>

                        <div class="password-box">

                            <input
                                type="password"
                                id="password"
                                placeholder="Enter your password"
                                required>

                            <i
                                class="fa-solid fa-eye"
                                id="togglePassword"></i>

                        </div>

                    </div>

                    <div id="errorMessage" class="auth-message error"></div>

                    <div id="successMessage" class="auth-message success"></div>

                    <button
                        type="submit"
                        class="auth-btn"
                        id="loginBtn">

                        <span id="loginText">
                            Login
                        </span>

                        <span id="loginLoader" style="display:none;">
                            <i class="fas fa-spinner fa-spin"></i>
                            Logging in...
                        </span>

                    </button>

                    <div class="auth-divider">
                        <span>OR</span>
                    </div>

                    <p class="auth-footer">

                        Don't have an account?

                        <a href="register.html">
                            Register Here
                        </a>

                    </p>

                </form>

            </div>

        </div>

    </section>

    <!-- FOOTER -->
    <footer class="footer">

        <div class="footer-bottom">

            <p>© 2026 Servora. All Rights Reserved.</p>

        </div>

    </footer>

    <script type="module" src="js/login.js"></script>
<script>
(function(){if(!window.chatbase||window.chatbase("getState")!=="initialized"){window.chatbase=(...arguments)=>{if(!window.chatbase.q){window.chatbase.q=[]}window.chatbase.q.push(arguments)};window.chatbase=new Proxy(window.chatbase,{get(target,prop){if(prop==="q"){return target.q}return(...args)=>target(prop,...args)}})}const onLoad=function(){const script=document.createElement("script");script.src="https://www.chatbase.co/embed.min.js";script.id="O5ymNa39oG-QvX7znz3HC";script.domain="www.chatbase.co";document.body.appendChild(script)};if(document.readyState==="complete"){onLoad()}else{window.addEventListener("load",onLoad)}})();
</script>
</body>

</html>
